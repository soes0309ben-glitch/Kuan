services:
  - type: web
    name: japan-travel
    runtime: python
    plan: free
    rootDir: japan-travel
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
