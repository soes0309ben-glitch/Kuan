[project]
name = "expense-app"
version = "0.1.0"
description = "LINE 記帳本：在 LINE 傳一句話就記帳，網頁看報表、管預算"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "psycopg2-binary>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
