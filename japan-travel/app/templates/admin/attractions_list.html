{% extends "base.html" %}
{% block title %}景點管理｜{{ APP_NAME }}{% endblock %}
{% block content %}
<section class="section container">
  <div class="section-title">
    <h2>景點管理</h2>
    <a class="btn" href="/admin/attractions/new">+ 新增景點</a>
  </div>
  <p><a href="/admin">← 回管理後台</a></p>

  <div class="admin-list">
    {% for a in attractions %}
    <div class="admin-list-row">
      <div class="admin-list-main">
        <strong>{{ a.name_zh }}</strong>
        <span class="card-meta">{{ REGION_LABELS.get(a.region, a.region) }}・{{ a.id }}</span>
      </div>
      <div class="admin-list-actions">
        <a class="icon-btn" href="/admin/attractions/{{ a.id }}/edit">編輯</a>
        <form action="/admin/attractions/{{ a.id }}/delete" method="post" onsubmit="return confirm('確定要刪除「{{ a.name_zh }}」嗎？');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
          <button type="submit" class="icon-btn danger">刪除</button>
        </form>
      </div>
    </div>
    {% else %}
    <div class="empty-state">還沒有任何景點。</div>
    {% endfor %}
  </div>
</section>
{% endblock %}
